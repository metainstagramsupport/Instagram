<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instagram Login Page</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }

  .logo {
    margin-top: 40px;
    margin-bottom: 20px;
  }

  .logo img {
    width: 175px;
  }

  .input-container {
    width: 300px;
    margin: 5px 0;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 8px 0;
    border: 1px solid #dbdbdb;
    border-radius: 4px;
    background: #fafafa;
    font-size: 14px;
  }

  .login-button {
    width: 300px;
    padding: 8px 0;
    margin-top: 10px;
    background-color: #3897f0;
    color: #fff;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    cursor: pointer;
  }

  .login-button:hover {
    background-color: #3182ce;
  }

  .forgot {
    margin-top: 10px;
    font-size: 12px;
    color: #00376b;
    text-align: center;
  }

  .create-account {
    width: 300px;
    margin: 20px 0;
    padding: 8px 0;
    border: 1px solid #0095f6;
    border-radius: 4px;
    background: transparent;
    color: #0095f6;
    font-weight: bold;
    cursor: pointer;
  }

  .create-account:hover {
    background-color: #f0f0f0;
  }

  .metalink {
    margin-top: 20px;
  }
</style>
</head>
<body>

<div class="logo">
  <img src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png" alt="Instagram Logo" />
</div>

<div class="input-container">
  <input type="text" placeholder="Username, email address or mobile number" />
</div>
<div class="input-container">
  <input type="password" placeholder="Password" />
</div>
<button class="login-button">Log In</button>
<div class="forgot">Forgot password?</div>
<button class="create-account">Create new account</button>
<div class="metalink">
  <a href="https://about.facebook.com/meta/" target="_blank" style="text-decoration:none; color:#385185; font-weight:600;">Meta</a>
</div>

</body>
</html>
