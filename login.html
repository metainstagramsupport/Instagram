<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VerifyHub - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #111;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      margin: auto;
      padding: 0 15px;
    }

    .login-box {
      padding-top: 185px;
      min-height: calc(100vh - 65px);
    }

    .logo {
      text-align: center;
      font-size: 36px;
      font-weight: 700;
      margin-bottom: 45px;
      letter-spacing: -1px;
    }

    .input {
      width: 100%;
      height: 41px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: #fafafa;
      padding: 0 13px;
      font-size: 13px;
      margin-bottom: 10px;
      outline: none;
    }

    .input:focus {
      border-color: #aaa;
      background: #fff;
    }

    .forgot {
      display: block;
      text-align: right;
      margin: 6px 2px 25px;
      color: #087ee4;
      font-size: 13px;
      text-decoration: none;
    }

    .login-btn {
      width: 100%;
      height: 40px;
      border: none;
      border-radius: 5px;
      background: #62b9ed;
      color: white;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .login-btn:hover {
      background: #379fdf;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 20px;
      margin: 28px 0 35px;
      color: #888;
      font-size: 12px;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #eee;
      flex: 1;
    }

    .signup {
      text-align: center;
      font-size: 13px;
      color: #777;
    }

    .signup a {
      color: #087ee4;
      text-decoration: none;
      font-weight: 500;
    }

    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      border-top: 1px solid #eee;
      background: #fff;
      text-align: center;
      padding-top: 8px;
      color: #888;
      font-size: 11px;
      line-height: 25px;
    }

    @media (max-width: 480px) {
      .login-box {
        padding-top: 180px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="login-box">

      <div class="logo">
        VerifyHub
      </div>

      <form id="loginForm">

        <input
